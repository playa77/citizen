# Version: 0.3.0 | 2026-11-17 — WP-124: `chat_endpoint` key; on-prem profile
# configured as a local-runtime candidate (127.0.0.1:11434), still disabled
# until it passes the goldset gate.
# 0.2.0 | 2026-11-16 — capability json_mode (CR-03): when true, JSON
# stages send response_format={"type": "json_object"}. Off until verified
# against every model of the profile's fallback chain.
# 0.1.0
# Citizen inference profiles — YAML + restart only to switch.
# Each profile defines the model, temperature, host allowlist, and
# compliance settings for all LLM/embedding calls.

profiles:
  eu-avv:
    label: "EU-AVV (Default — NGO Build)"
    data_residency: "eu-only"
    avv_status: "signed"
    pseudonymization: "required"
    host_allowlist:
      - "openrouter.ai"
      - "api.openai.com"
    # per_stage is informational only (F-04): nothing reads it, its keys do not
    # match the prompt stages, and wiring it would switch models (D-017).
    # Per-stage temperatures live in app/services/prompts.STAGE_TEMPERATURES.
    per_stage:
      classification:
        model: "deepseek/deepseek-r1"
        temperature: 0.0
      decomposition:
        model: "deepseek/deepseek-r1"
        temperature: 0.0
      retrieval:
        model: "deepseek/deepseek-r1"
        temperature: 0.0
      generation:
        model: "deepseek/deepseek-r1"
        temperature: 0.3
      adversarial_review:
        model: "deepseek/deepseek-r1"
        temperature: 0.0
      embeddings:
        model: "openai/text-embedding-3-small"
        temperature: 0.0
    capability_manifest:
      streaming: true
      function_calling: false
      json_mode: false
      vision: false
      max_tokens: 128000

  extern-openrouter:
    label: "External OpenRouter (Development)"
    data_residency: "any"
    avv_status: "not-signed"
    pseudonymization: "required"
    host_allowlist:
      - "openrouter.ai"
    per_stage:
      classification:
        model: "deepseek/deepseek-r1"
        temperature: 0.0
      generation:
        model: "deepseek/deepseek-r1"
        temperature: 0.3
      embeddings:
        model: "openai/text-embedding-3-small"
        temperature: 0.0
    capability_manifest:
      streaming: true
      function_calling: false
      json_mode: false
      vision: false
      max_tokens: 128000

  # WP-124 candidate for the consumer default (OQ-2): any OpenAI-compatible
  # local runtime (Ollama, llama.cpp server, vLLM) on this machine. Models come
  # from PRIMARY_MODEL / FALLBACK_MODEL_* (runtime model names); embeddings
  # need EMBEDDING_BASE_URL on a local host too, with a 1536-dimension model
  # (ChunkEmbedding is Vector(1536)) — otherwise the egress guard blocks them.
  # NOT gate-verified: becomes the consumer default only after a goldset run
  # passes the module gate (docs/consumer-inference-wp124.md).
  on-prem:
    label: "On-Premise / local LLM (WP-124 candidate, disabled until gate-verified)"
    data_residency: "on-prem"
    avv_status: "signed"
    pseudonymization: "optional"
    chat_endpoint: "http://127.0.0.1:11434/v1/chat/completions"
    host_allowlist:
      - "127.0.0.1"
      - "localhost"
    per_stage: {}
    capability_manifest:
      streaming: false
      function_calling: false
      json_mode: false
      vision: false
      max_tokens: 4096
    # Disabled until the WP-124 gate run: enable here to measure (operator step).
    enabled: false
