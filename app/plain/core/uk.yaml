disclaimer:
  title: 'Перед початком: межі Citizen'
  points:
  - Citizen допомагає зрозуміти листи й підготуватися до консультації у власній справі.
  - Це не юридична консультація й не заміна консультанта або адвоката.
  - Частину результатів пише штучний інтелект, який може помилятися. Перевіряйте кожний результат перед
    використанням.
  - Строки та суми обчислюються за сталими правилами. Також перевірте їх із фахівцем.
  - Використовуйте Citizen лише для власних справ.
  - Листи є чернетками. Перевірте й заповніть кожне місце [BITTE PRÜFEN]. Ви вирішуєте, що надсилати.
  - Програма безкоштовна й має відкритий код. Відповідальність за помилки обмежена настільки, наскільки
    дозволяє закон.
  ack_label: Я прочитав ці пояснення й користуюся Citizen на власну відповідальність.
  full_text_note: Повний текст міститься в DISCLAIMER_DE.md та DISCLAIMER_EN.md. Цей виклад його не замінює.
