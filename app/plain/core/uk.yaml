privacy:
  title: Що відбувається з даними
  storage: Листи й аналізи зберігаються в базі даних цієї інсталяції до видалення.
  deletion: Ви можете видалити кожну справу. Розмови із завантаженими документами видаляються окремо.
  inference:
    eu-avv: Тексти надсилаються сервісу штучного інтелекту в ЄС. Ідентифікатори спочатку замінюються позначками.
      Захист блокує інші напрямки передавання.
    extern-openrouter: Тексти надсилаються зовнішньому сервісу, що може працювати поза ЄС. Імена, адреси,
      номери справ і банківські дані спочатку замінюються позначками.
    on-prem: Аналіз виконується на комп’ютері цієї інсталяції. Тексти не надсилаються зовнішньому сервісу
      штучного інтелекту.
    unknown: Запитайте оператора інсталяції, куди надсилаються тексти для аналізу.
  deployment:
    dev: Це тестова інсталяція. Завантажуйте лише синтетичні зразки, а не справжні листи.
    self: Ви самі керуєте інсталяцією та визначаєте доступ.
    provider: Інсталяцією керує організація, відповідальна за дані. Попросіть її повідомлення про конфіденційність.
  residual_risk: Заміна даних не дає повного захисту. Решта тексту іноді дозволяє впізнати людину.
