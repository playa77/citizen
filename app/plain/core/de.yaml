disclaimer:
  title: "Bevor Sie anfangen: Was Citizen ist und was nicht"
  points:
    - "Citizen hilft Ihnen, ein Schreiben von einer Behörde oder einer anderen Stelle zu verstehen. Und es hilft Ihnen, Ihren Termin bei einer Beratungsstelle oder einer Anwältin oder einem Anwalt vorzubereiten."
    - "Citizen ist keine Rechtsberatung. Citizen ersetzt keine Beratungsstelle und keine Anwältin und keinen Anwalt."
    - "Einen Teil der Ergebnisse schreibt eine KI. Die KI kann sich irren. Prüfen Sie jedes Ergebnis, bevor Sie es verwenden."
    - "Fristen und Beträge rechnet Citizen nach festen Regeln aus. Auch diese Zahlen sollten Sie mit einer Beratungsstelle prüfen."
    - "Nutzen Sie Citizen nur für Ihre eigenen Angelegenheiten."
    - "Entwürfe für Schreiben sind nur Entwürfe. Stellen mit [BITTE PRÜFEN] müssen Sie selbst prüfen und ergänzen. Sie entscheiden, was Sie abschicken."
    - "Citizen ist kostenlos und quelloffen. Für Fehler übernimmt der Autor keine Haftung, soweit das Gesetz das erlaubt."
  ack_label: "Ich habe diese Hinweise gelesen. Ich nutze Citizen auf eigene Verantwortung."
  full_text_note: "Den vollständigen rechtlichen Hinweis finden Sie im Dokument DISCLAIMER_DE.md. Er gilt, wenn diese Kurzfassung etwas offenlässt."

ai_notice:
  title: "Hinweis: Dieses Ergebnis stammt von einer KI"
  text: "Diese Auswertung hat ein KI-System erstellt. Sie ist nicht rechtsverbindlich. Prüfen Sie die Ergebnisse, bevor Sie sie verwenden."

privacy:
  title: "Was mit Ihren Daten passiert"
  storage: "Ihre Schreiben und Auswertungen werden in der Datenbank dieser Citizen-Installation gespeichert, bis Sie sie löschen."
  deletion: "Sie können jeden Fall löschen. Unterhaltungen mit hochgeladenen Dokumenten löschen Sie getrennt."
  inference:
    eu-avv: "Für die Auswertung werden Texte an einen KI-Dienst in der EU geschickt. Vorher werden Namen, Adressen, Nummern und Kontodaten durch Platzhalter ersetzt. Ein Schutz blockiert Übermittlungen an andere Stellen."
    extern-openrouter: "Für die Auswertung werden Texte an einen externen KI-Dienst geschickt. Der Dienst kann auch außerhalb der EU arbeiten. Vorher werden Namen, Adressen, Nummern und Kontodaten durch Platzhalter ersetzt."
    on-prem: "Die Auswertung läuft auf einem Rechner dieser Installation. Ihre Texte werden nicht an einen externen KI-Dienst geschickt."
    unknown: "Fragen Sie die Stelle, die diese Installation betreibt, wohin Texte für die Auswertung geschickt werden."
