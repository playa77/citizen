disclaimer:
  title: 'پیش از شروع: محدودیت‌های Citizen'
  points:
  - Citizen به فهم نامه‌ها و آمادگی برای مشاوره درباره کار شخصی شما کمک می‌کند.
  - این ابزار مشاوره حقوقی نیست و جای مشاور یا وکیل را نمی‌گیرد.
  - بخشی از نتیجه را هوش مصنوعی می‌نویسد و ممکن است اشتباه کند. پیش از استفاده همه نتایج را بررسی کنید.
  - مهلت‌ها و مبلغ‌ها با قواعد ثابت محاسبه می‌شوند. آن‌ها را هم با مشاور بررسی کنید.
  - فقط برای امور شخصی خود استفاده کنید.
  - نامه‌ها پیش‌نویس هستند. هر بخش [BITTE PRÜFEN] را بررسی و تکمیل کنید. تصمیم ارسال با شماست.
  - نرم‌افزار رایگان و متن‌باز است. مسئولیت خطاها تا حد مجاز قانونی محدود است.
  ack_label: این توضیحات را خوانده‌ام و با مسئولیت خود از Citizen استفاده می‌کنم.
  full_text_note: متن کامل در DISCLAIMER_DE.md و DISCLAIMER_EN.md است. این خلاصه جایگزین آن نیست.
ai_notice:
  title: 'توجه: نتیجه هوش مصنوعی'
  text: این تحلیل را هوش مصنوعی تولید کرده است. الزام حقوقی ندارد. پیش از استفاده آن را بررسی کنید.
privacy:
  title: چه اتفاقی برای داده‌ها می‌افتد
  storage: نامه‌ها و تحلیل‌ها تا زمان حذف در پایگاه داده این نصب ذخیره می‌شوند.
  deletion: می‌توانید هر پرونده را حذف کنید. گفتگوهای دارای سند بارگذاری‌شده جداگانه حذف می‌شوند.
  inference:
    eu-avv: متن به سرویس هوش مصنوعی در اتحادیه اروپا فرستاده می‌شود. ابتدا شناسه‌ها با جایگزین‌ها پوشانده
      می‌شوند. محافظ فنی مقصدهای دیگر را مسدود می‌کند.
    extern-openrouter: متن به سرویس خارجی فرستاده می‌شود که ممکن است خارج اتحادیه اروپا باشد. نام، نشانی،
      شماره پرونده و اطلاعات بانکی ابتدا جایگزین می‌شوند.
    on-prem: تحلیل روی رایانه همین نصب انجام می‌شود. متن به سرویس هوش مصنوعی خارجی فرستاده نمی‌شود.
    unknown: از گرداننده نصب بپرسید متن برای تحلیل به کجا فرستاده می‌شود.
  deployment:
    dev: این نصب آزمایشی است. فقط اسناد ساختگی بارگذاری کنید، نه نامه واقعی.
    self: شما این نصب را اداره می‌کنید و دسترسی را تعیین می‌کنید.
    provider: یک سازمان این نصب را اداره می‌کند و مسئول داده‌هاست. اطلاعیه حریم خصوصی را از آن بخواهید.
  residual_risk: جایگزین‌ها حفاظت کامل ایجاد نمی‌کنند. متن باقی‌مانده ممکن است هویت فرد را آشکار کند.
