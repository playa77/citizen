disclaimer:
  title: 'Перед началом: ограничения Citizen'
  points:
  - Citizen помогает понять письма и подготовиться к консультации по собственному делу.
  - Это не юридическая консультация и не замена консультанта или адвоката.
  - Часть результатов пишет искусственный интеллект, который может ошибаться. Проверяйте каждый результат
    перед использованием.
  - Сроки и суммы рассчитываются по фиксированным правилам. Также проверьте их со специалистом.
  - Используйте Citizen только для собственных дел.
  - Письма являются черновиками. Проверьте и заполните каждое место [BITTE PRÜFEN]. Вы решаете, что отправлять.
  - Программа бесплатна и имеет открытый код. Ответственность за ошибки ограничена в допустимых законом
    пределах.
  ack_label: Я прочитал эти пояснения и использую Citizen под свою ответственность.
  full_text_note: Полный текст находится в DISCLAIMER_DE.md и DISCLAIMER_EN.md. Этот пересказ его не заменяет.
ai_notice:
  title: 'Внимание: результат искусственного интеллекта'
  text: Этот анализ создал искусственный интеллект. Он не имеет юридической силы. Проверьте его перед
    использованием.
privacy:
  title: Что происходит с данными
  storage: Письма и анализы хранятся в базе данных этой установки до удаления.
  deletion: Вы можете удалить каждое дело. Разговоры с загруженными документами удаляются отдельно.
  inference:
    eu-avv: Тексты отправляются сервису искусственного интеллекта в ЕС. Идентификаторы сначала заменяются
      обозначениями. Защита блокирует передачу по другим направлениям.
    extern-openrouter: Тексты отправляются внешнему сервису, который может работать вне ЕС. Имена, адреса,
      номера дел и банковские данные сначала заменяются обозначениями.
    on-prem: Анализ выполняется на компьютере этой установки. Тексты не отправляются внешнему сервису
      искусственного интеллекта.
    unknown: Спросите оператора установки, куда отправляются тексты для анализа.
  deployment:
    dev: Это тестовая установка. Загружайте только синтетические образцы, а не настоящие письма.
    self: Вы сами управляете установкой и определяете доступ.
    provider: Установкой управляет организация, отвечающая за данные. Запросите её уведомление о конфиденциальности.
  residual_risk: Замена данных не обеспечивает полной защиты. Остаток текста иногда позволяет установить
    личность.
