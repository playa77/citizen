  text: Bu analizi yapay zekâ üretti. Hukuken bağlayıcı değildir. Kullanmadan önce kontrol edin.
privacy:
  title: Verilerinize ne olur
  storage: Mektuplar ve analizler siz silene kadar bu kurulumun veritabanında saklanır.
  deletion: Her dosyayı silebilirsiniz. Yüklenen belgeleri içeren konuşmalar ayrı silinir.
  inference:
    eu-avv: Metinler AB içindeki yapay zekâ hizmetine gönderilir. Kimlik bilgileri önce yer tutucularla
      değiştirilir. Teknik koruma başka hedeflere gönderimi engeller.
    extern-openrouter: Metinler AB dışında da çalışabilen harici bir hizmete gönderilir. Adlar, adresler,
      dosya numaraları ve banka bilgileri önce yer tutucularla değiştirilir.
    on-prem: Analiz bu kurulumdaki bir bilgisayarda yapılır. Metinler harici yapay zekâ hizmetine gönderilmez.
    unknown: Analiz için metinlerin nereye gönderildiğini kurulum sorumlusuna sorun.
  deployment:
    dev: Bu bir test kurulumudur. Yalnızca sentetik örnek belgeler yükleyin, gerçek mektuplar yüklemeyin.
    self: Bu kurulumu siz yönetir ve erişimi siz belirlersiniz.
    provider: Kurulumu bir kuruluş yönetir ve verilerinizden sorumludur. Gizlilik bildirimini ondan isteyin.
  residual_risk: Yer tutucular tam koruma sağlamaz. Kalan metin bazen kişinin kimliğini gösterebilir.
