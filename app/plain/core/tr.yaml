disclaimer:
  title: 'Başlamadan önce: Citizen sınırları'
  points:
  - Citizen mektupları anlamanıza ve kendi işiniz için danışma görüşmesine hazırlanmanıza yardımcı olur.
  - Hukuki danışmanlık değildir; danışman veya avukatın yerini tutmaz.
  - Sonuçların bir bölümünü yapay zekâ yazar ve hata yapabilir. Kullanmadan önce her sonucu kontrol edin.
  - Süreler ve tutarlar sabit kurallarla hesaplanır. Bunları da uzmanla kontrol edin.
  - Citizen uygulamasını yalnızca kendi işleriniz için kullanın.
  - Mektuplar taslaktır. Her [BITTE PRÜFEN] alanını kontrol edip tamamlayın. Neyi göndereceğinize siz
    karar verirsiniz.
  - Yazılım ücretsiz ve açık kaynaklıdır. Hatalara ilişkin sorumluluk, hukukun izin verdiği ölçüde sınırlıdır.
  ack_label: Bu açıklamaları okudum. Citizen uygulamasını kendi sorumluluğumda kullanıyorum.
  full_text_note: Tam metin DISCLAIMER_DE.md ve DISCLAIMER_EN.md dosyalarındadır. Bu özet onların yerine
    geçmez.
ai_notice:
