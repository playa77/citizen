disclaimer:
  title: 'قبل البدء: حدود Citizen'
  points:
  - يساعدك Citizen على فهم الرسائل والتحضير لاستشارة بشأن أمورك الشخصية.
  - ليس استشارة قانونية ولا يحل محل جهة استشارية أو محامٍ.
  - بعض النتائج يكتبها ذكاء اصطناعي قد يخطئ. تحقق من كل نتيجة قبل استخدامها.
  - تُحسب المهل والمبالغ بقواعد ثابتة. تحقق منها أيضاً مع جهة مختصة.
  - استخدمه لأمورك الشخصية فقط.
  - الرسائل مسودات. راجع وأكمل كل موضع يحمل [BITTE PRÜFEN]. أنت تقرر ما ترسله.
  - البرنامج مجاني ومفتوح المصدر. المسؤولية عن الأخطاء محدودة بقدر ما يسمح به القانون.
  ack_label: قرأت هذه الملاحظات وأستخدم Citizen على مسؤوليتي.
  full_text_note: الإشعار الكامل في DISCLAIMER_DE.md وDISCLAIMER_EN.md. هذا الملخص لا يستبدله.
ai_notice:
  title: 'تنبيه: نتيجة من ذكاء اصطناعي'
  text: أنتج نظام ذكاء اصطناعي هذا التحليل. ليس ملزماً قانونياً. تحقق منه قبل الاستخدام.
privacy:
  title: ما يحدث لبياناتك
  storage: تُخزن الرسائل والتحليلات في قاعدة بيانات هذا التثبيت حتى حذفها.
  deletion: يمكنك حذف كل ملف قضية. تُحذف المحادثات مع المستندات المرفوعة بشكل منفصل.
  inference:
    eu-avv: تُرسل النصوص إلى خدمة ذكاء اصطناعي في الاتحاد الأوروبي. تُستبدل المعرّفات بعلامات أولاً. يمنع
      حاجز تقني الإرسال إلى وجهات أخرى.
    extern-openrouter: تُرسل النصوص إلى خدمة خارجية قد تعمل خارج الاتحاد الأوروبي. تُستبدل الأسماء والعناوين
      وأرقام المراجع والبيانات المصرفية بعلامات أولاً.
    on-prem: يجري التحليل على جهاز هذا التثبيت. لا تُرسل النصوص إلى خدمة ذكاء اصطناعي خارجية.
    unknown: اسأل مشغّل التثبيت عن وجهة إرسال النصوص للتحليل.
  deployment:
    dev: هذا تثبيت تجريبي. ارفع مستندات اصطناعية فقط، لا رسائل حقيقية.
    self: أنت تشغّل هذا التثبيت وتقرر من يمكنه الوصول إليه.
    provider: تشغّل مؤسسة هذا التثبيت وتتحمل مسؤولية بياناتك. اطلب إشعار الخصوصية منها.
  residual_risk: العلامات البديلة لا توفر حماية كاملة. قد يكشف النص المتبقي هوية الشخص.
