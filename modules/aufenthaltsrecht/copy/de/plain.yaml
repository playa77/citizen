findings:
  frist_pruefen:
    title: Frist sofort prüfen
    text: Bei BAMF-Bescheiden oder drohender Abschiebung sofort qualifizierte Hilfe suchen. Klage und
      Eilantrag können getrennt nötig sein.
    next_step: Bescheid, Belehrung und Zugangsnachweis sicher zur Beratung mitbringen.
  aufenthalt_vorbereiten:
    title: Aufenthalt vorbereiten
    text: Ein Termin ist kein belegter Antragseingang. Rechenergebnisse geben keinen sicheren Status und
      keine Reise- oder Arbeitserlaubnis.
    next_step: Titel, Ablaufdatum und belegten Antragseingang individuell prüfen lassen.
  beratung_erforderlich:
    title: Beratung erforderlich
    text: Asyl-Übergangsrecht, Einbürgerung und Lebensunterhalt brauchen individuelle Prüfung. Wir verfassen
      keine Asylbegründung und bewerten keine Glaubwürdigkeit.
    next_step: Keine Verfolgungsgeschichte, Religion, Diagnosen oder unnötige Drittdaten hochladen.
  einordnung_offen:
    title: Einordnung offen
    text: Verfahren oder Voraussetzungen sind unklar. Ein unbekanntes Datum bedeutet keine Sicherheit.
    next_step: Bei kurzen Fristen sofort qualifizierte Hilfe suchen.
