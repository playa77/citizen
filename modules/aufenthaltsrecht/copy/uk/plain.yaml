findings:
  frist_pruefen:
    title: Негайно перевірте строк
    text: У разі рішення BAMF або загрози видворення негайно зверніться по фахову допомогу. Позов і заява
      про тимчасовий захист можуть бути потрібні окремо.
    next_step: Збережіть повне рішення, роз’яснення оскарження та підтвердження отримання для консультації.
  aufenthalt_vorbereiten:
    title: Підготуйте питання про проживання
    text: Запис на прийом не підтверджує подання заяви. Розрахунок не встановлює статусу чи дозволу на
      подорожі або роботу.
    next_step: Окремо перевірте дозвіл, закінчення його дії та підтверджене отримання заяви.
  beratung_erforderlich:
    title: Зверніться по індивідуальну консультацію
    text: Перехідні правила притулку, громадянство та забезпечення проживання потребують індивідуальної
      перевірки. Ми не пишемо обґрунтування притулку й не оцінюємо достовірність.
    next_step: Не завантажуйте розповіді про переслідування, релігію, діагнози чи зайві дані інших людей.
  einordnung_offen:
    title: Обставини незрозумілі
    text: Процедура чи умови незрозумілі. Невідома дата не означає безпеки.
    next_step: За коротких строків негайно зверніться по фахову допомогу.
