    texts:
      computed: 'Розраховане закінчення: {frist_ende}. Підстава: {basis}. Негайно перевірте з фахівцем.'
      provisional: 'Попереднє закінчення: {frist_ende}. Негайно перевірте відсутні дані.'
      missing_input: Бракує підтверджених даних. Надійної дати немає. Негайно зверніться по фахову допомогу.
