    texts:
      computed: 'Рассчитанное окончание: {frist_ende}. Основание: {basis}. Немедленно проверьте со специалистом.'
      provisional: 'Предварительное окончание: {frist_ende}. Немедленно проверьте недостающие данные.'
      missing_input: Подтверждённых данных недостаточно. Надёжной даты нет. Немедленно обратитесь за квалифицированной
        помощью.
      not_applicable: Это правило не применяется. Возможны другие короткие сроки. Немедленно обратитесь
