module: aufenthaltsrecht
language: ru
review:
  status: draft
  reviewer: null
  date: null
  note: Human legal/language review pending under D-071.
findings:
  frist_pruefen:
    title: Немедленно проверьте срок
    text: При решении BAMF или угрозе выдворения немедленно обратитесь за квалифицированной помощью. Иск
      и ходатайство о временной судебной защите могут требоваться отдельно.
    next_step: Сохраните полное решение, разъяснение обжалования и подтверждение получения для консультации.
  aufenthalt_vorbereiten:
    title: Подготовьте вопросы о проживании
    text: Запись на приём не подтверждает подачу заявления. Расчёт не устанавливает статус или разрешение
      на поездки и работу.
    next_step: Отдельно проверьте разрешение, срок его действия и подтверждённое получение заявления.
  beratung_erforderlich:
    title: Получите индивидуальную консультацию
    text: Переходные правила убежища, гражданство и обеспечение проживания требуют индивидуальной проверки.
      Мы не пишем обоснования убежища и не оцениваем достоверность.
    next_step: Не загружайте рассказы о преследовании, религии, диагнозах или лишние данные других людей.
  einordnung_offen:
    title: Обстоятельства неясны
    text: Процедура или условия неясны. Неизвестная дата не означает безопасности.
    next_step: При коротких сроках немедленно обратитесь за квалифицированной помощью.
