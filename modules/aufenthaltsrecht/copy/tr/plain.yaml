findings:
  frist_pruefen:
    title: Süreyi hemen kontrol edin
    text: BAMF kararı veya sınır dışı edilme tehlikesinde hemen uzman yardımı alın. Dava ve geçici hukuki
      koruma başvurusu ayrı ayrı gerekebilir.
    next_step: Kararın tamamını, başvuru yolu bilgisini ve teslim belgesini danışma için saklayın.
  aufenthalt_vorbereiten:
    title: Oturum sorularınızı hazırlayın
    text: Randevu, başvurunun alındığını kanıtlamaz. Hesaplama oturum statüsü ya da seyahat veya çalışma
      izni sağlamaz.
    next_step: Oturum belgesini, bitiş tarihini ve kanıtlanmış başvuru teslimini ayrı ayrı inceletin.
  beratung_erforderlich:
    title: Bireysel danışmanlık alın
    text: İltica geçiş kuralları, vatandaşlık ve geçim koşulları bireysel inceleme gerektirir. İltica
      gerekçesi yazmıyor, inandırıcılık değerlendirmiyoruz.
    next_step: Zulüm öyküleri, din, teşhis veya başkaları hakkında gereksiz veriler yüklemeyin.
  einordnung_offen:
    title: Bilgiler belirsiz
    text: Usul veya koşullar belirsiz. Tarihin bilinmemesi güvende olduğunuz anlamına gelmez.
    next_step: Kısa sürelerde hemen uzman yardımı alın.
