findings:
  frist_pruefen:
    title: تحقق من المهلة فوراً
    text: عند تلقي قرار من BAMF أو خطر الترحيل، اطلب مساعدة مختصة فوراً. قد تحتاج إلى دعوى وطلب حماية
      مستعجلة منفصلين.
    next_step: احتفظ بالقرار كاملاً وإرشادات الطعن وإثبات الاستلام لعرضها في الاستشارة.
  aufenthalt_vorbereiten:
    title: جهّز أسئلة الإقامة
    text: الموعد ليس دليلاً على تقديم الطلب. الحساب لا يثبت وضع الإقامة ولا إذن السفر أو العمل.
    next_step: اطلب فحص تصريح الإقامة وتاريخ انتهائه وإثبات وصول الطلب بصورة فردية.
  beratung_erforderlich:
    title: اطلب استشارة فردية
    text: قواعد اللجوء الانتقالية والتجنس والمعيشة تحتاج إلى فحص فردي. لا نصوغ روايات اللجوء ولا نقيّم
      المصداقية.
    next_step: لا ترفع روايات الاضطهاد أو معلومات الدين أو التشخيصات أو بيانات غير لازمة عن الآخرين.
  einordnung_offen:
    title: المعلومات غير واضحة
    text: الإجراء أو الشروط غير واضحة. عدم معرفة الموعد لا يعني الأمان.
    next_step: عند وجود مهل قصيرة، اطلب مساعدة مختصة فوراً.
