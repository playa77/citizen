findings:
  frist_pruefen:
    title: مهلت را فوراً بررسی کنید
    text: برای تصمیم BAMF یا خطر اخراج، فوراً کمک تخصصی بگیرید. ممکن است هم دادخواست و هم درخواست حمایت
      فوری لازم باشد.
    next_step: تصمیم کامل، راهنمای اعتراض و مدرک دریافت را برای مشاوره نگه دارید.
  aufenthalt_vorbereiten:
    title: پرسش‌های اقامت را آماده کنید
    text: وقت ملاقات مدرک ثبت درخواست نیست. محاسبه وضعیت اقامت یا اجازه سفر و کار را ثابت نمی‌کند.
    next_step: نوع اجازه اقامت، پایان اعتبار و مدرک وصول درخواست را جداگانه بررسی کنید.
  beratung_erforderlich:
    title: مشاوره فردی بگیرید
    text: قواعد انتقالی پناهندگی، تابعیت و هزینه زندگی نیاز به بررسی فردی دارند. روایت پناهندگی نمی‌نویسیم
      و اعتبار گفته‌ها را ارزیابی نمی‌کنیم.
    next_step: شرح آزار، دین، تشخیص پزشکی یا اطلاعات غیرضروری دیگران را بارگذاری نکنید.
  einordnung_offen:
    title: اطلاعات روشن نیست
    text: روند یا شرایط روشن نیست. نامعلوم بودن تاریخ به معنی ایمنی نیست.
    next_step: برای مهلت‌های کوتاه فوراً کمک تخصصی بگیرید.
