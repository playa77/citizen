id: verkehrsrecht
version: 0.1.0
core_api: '>=3.7,<4.0'
title:
  de: Verkehrsrecht
  en: Traffic law
tier: experimental
scope:
  summary_de: 'Eigene Verkehrsordnungswidrigkeit: Bußgeldbescheid, Einspruch, Akteneinsicht, Fahrverbot
    und Register für Beratung vorbereiten.'
  own_matter_only: true
  out_of_scope:
  - Unfallschadensregulierung (Stufe 2)
  - Strafverfahren, Alkohol-/Drogendelikte und Entziehung der Fahrerlaubnis
  - Automatische Verjährungsfeststellung oder Bestätigung einer Fahrberechtigung
  - Historische/ungeklärte Übergangsregime und vollständiger Bußgeldkatalog
corpus: corpus.yaml
intake: intake.yaml
intake_schema: intake-schema.yaml
dossier: dossier.yaml
fristen: fristen.yaml
parameters:
  domain: verkehrsrecht
  files:
  - parameters/*.yaml
calculators: calculators:CALCULATORS
prompts: prompts/profile.yaml
document_templates: documents/templates.yaml
documents:
- pruefhinweise
- einspruch
- akteneinsicht
- anhoerung
goldset:
  path: goldset/goldset-v0.1.0.yaml
plain_language:
  files:
    de: copy/de/plain.yaml
    en: copy/en/plain.yaml
    de-LS: copy/de-LS/plain.yaml
  goldset: goldset/plain-v1.0.0.yaml
errata: errata.yaml
compliance:
  disclaimer_addendum: DISCLAIMER_ADDENDUM.md
  purpose_drift_deny_file: compliance/deny-phrases.json
legacy_aliases: []
