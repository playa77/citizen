# WP-130 implementation. Experimental; human reviews deferred under D-071.
id: schuldnerrecht
version: 0.2.0
core_api: ">=3.3,<4.0"
title:
  de: "Schulden und Vollstreckung"
  en: "Debt and enforcement"
