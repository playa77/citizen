$schema: https://json-schema.org/draft/2020-12/schema
$id: https://citizen.local/schemas/schuldnerrecht-intake-v0.1.0
title: Experimental own-matter debt intake authoring schema
description: Public module-specific intake form schema; existing API requests retain their own validation.
  Facts supplied to the dossier are confirmations. Legal qualification flags require explicit qualified
  evidence; unknown remains null. Human review remains draft.
type: object
additionalProperties: false
required:
- own_matter_confirmed
properties:
  own_matter_confirmed:
    const: true
    description: Natural person preparing their own matter, never creditor collection or law enforcement.
  synthetic_data_confirmed:
    type: boolean
    description: Development ingestion guards independently require synthetic or goldset documents.
  document_type:
    type: string
    enum:
    - mahnbescheid
    - vollstreckungsbescheid
    - inkassoschreiben
    - pfaendungsbeschluss
    - kontoauszug
    - lohnabrechnung
    - auskunfteischreiben
    - sonstiges
    description: Explicitly confirmed classification; missing is not a negative determination.
  zustellung_tatsaechlich:
    type: string
    format: date
    description: Confirmed actual court service date. Never derive from letter date, receipt estimate
      or postal fiction.
  zustellungsart:
    type: string
    enum:
    - inland
    - ausland
    - oeffentlich
    description: Only inland service is covered by the domestic deterministic deadline rules.
  service_date_confirmed:
    const: true
  bescheid_datum:
    type: string
    format: date
    description: Document date only. Does not establish court service.
  bundesland:
    type: string
    enum:
    - BW
    - BY
    - BE
    - BB
    - HB
    - HH
    - HE
    - MV
    - NI
    - NW
    - RP
    - SL
    - SN
    - ST
    - SH
    - TH
  calculation_type:
    enum:
    - none
    - wage_attachment
    - p_account
    - limitation
    - collection_costs
  as_of: &id002
    type: string
    format: date
  dependants:
    type: integer
    minimum: 0
    maximum: 5
    description: Actually supported persons with a legal entitlement, not household size. Five represents
      the statutory five-or-more table column.
  net_income_cents:
    type: integer
    minimum: 0
    description: Confirmed adjusted monthly attachment net, not gross pay or an unqualified bank credit.
  principal_cents: &id001
    type: integer
    minimum: 0
    description: Integer cents; never a number generated by legal inference.
  claimed_costs_cents: *id001
  stated_amount_cents: *id001
  claim_class:
    enum:
    - ordinary
    - titled
  arisen_on: *id002
  knowledge_on: *id002
  title_effective_on: *id002
  holiday_dates:
    type: array
    items: *id002
    uniqueItems: true
    description: Full confirmed statutory holiday calendar at the relevant place of performance, not a
      guessed national subset.
  fee_case:
    enum:
    - simple
    - normal
    - extensive
  claims:
    type: array
    items:
      type: object
      required:
      - creditor_label
      - reference
      - principal_cents
      - interest_cents
      - costs_cents
      - payments_cents
      - breakdown_confirmed
      additionalProperties: false
      properties:
        creditor_label:
          type: string
          minLength: 1
          description: Synthetic label only in development.
        reference:
          type: string
          minLength: 1
        principal_cents: *id001
        interest_cents: *id001
        costs_cents: *id001
        payments_cents: *id001
        breakdown_confirmed: &id003
          type: boolean
        disputed:
          type:
          - boolean
          - 'null'
        interest_basis:
          type:
          - string
          - 'null'
        payment_allocation_confirmed: *id003
  qualification_note:
    type: string
    description: Source of legal qualification and remaining uncertainty; no legal status is inferred
      from silence.
  dependants_confirmed: &id004
    type:
    - boolean
    - 'null'
    description: Only an explicit informed confirmation supplies true or false. Unknown is null; absence
      is not false.
  special_order: *id004
  ordinary_claim: *id004
  monthly: *id004
  actual_support: *id004
  other_increases: *id004
  applicability_confirmed: *id004
  suspension: *id004
  restart: *id004
  special_limitation: *id004
  recurring_future_payments: *id004
  title_start_confirmed: *id004
  calendar_confirmed: *id004
  undisputed: *id004
  titled: *id004
  default_confirmed: *id004
  transition_confirmed: *id004
  duplicate_fees: *id004
  extensive_confirmed: *id004
  vat_recoverable: *id004
allOf:
- if:
    required:
    - zustellung_tatsaechlich
  then:
    required:
    - service_date_confirmed
    - document_type
    - zustellungsart
- if:
    properties:
      calculation_type:
        enum:
        - wage_attachment
        - p_account
        - limitation
        - collection_costs
    required:
    - calculation_type
  then:
    required:
    - as_of
