findings:
  forderung_pruefen:
    title: Forderung prüfen
    text: Grund und Nachweise der Forderung sind noch zu prüfen. Citizen bestätigt keine Zahlungspflicht.
    next_step: Nehmen Sie Verträge, Rechnungen und Zahlungsbelege zur Schuldnerberatung mit.
  kosten_pruefen:
    title: Kosten prüfen
    text: Einzelne Kostenpositionen benötigen eine Prüfung. Citizen bestätigt weder ihre Berechtigung
      noch einen geschuldeten Gesamtbetrag.
    next_step: Bitten Sie um eine aufgeschlüsselte Forderung. Lassen Sie Zinsen und Inkassokosten prüfen.
  frist_pruefen:
    title: Gerichtliche Frist prüfen
    text: Dokumentart, tatsächliche Zustellung und Verfahrensstand müssen geklärt werden.
    next_step: Bewahren Sie den Umschlag auf. Lassen Sie gerichtliche Schreiben unverzüglich prüfen.
  beratung_erforderlich:
    title: Beratung erforderlich
    text: Ihr Fall benötigt eine individuelle Prüfung. Citizen stellt keine Bescheinigung aus und erstellt
      keinen Insolvenzantrag.
    next_step: Wenden Sie sich an eine geeignete Schuldnerberatungsstelle oder eine fachkundige anwaltliche
      Beratung.
  einordnung_offen:
    title: Einordnung noch offen
    text: Die Angaben reichen noch nicht für eine Einordnung. Das bestätigt weder die Forderung noch ihre
      Unwirksamkeit.
    next_step: Sammeln Sie Schreiben und Nachweise. Beachten Sie mögliche gerichtliche Fristen.
