findings:
  forderung_pruefen:
    title: Check the claim
    text: The basis and evidence for the claim still need checking. Citizen does not confirm that you
      owe payment.
    next_step: Bring contracts, invoices and payment records to debt advice.
  kosten_pruefen:
    title: Check the costs
    text: Individual cost items need checking. Citizen confirms neither their validity nor a total amount
      owed.
    next_step: Ask for an itemised statement. Have interest and collection costs checked.
  frist_pruefen:
    title: Check the court deadline
    text: The document type, actual service and procedural stage need checking.
    next_step: Keep the envelope. Have court documents checked urgently.
  beratung_erforderlich:
    title: Individual advice needed
    text: Your case needs individual review. Citizen issues no certificate and prepares no insolvency
      application.
    next_step: Contact a suitable debt advice centre or a qualified lawyer.
  einordnung_offen:
    title: Classification still open
    text: The information does not support a classification yet. This confirms neither the claim nor its
      invalidity.
    next_step: Collect letters and evidence. Keep possible court deadlines in mind.
