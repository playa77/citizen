# WP-131 backend implementation; experimental, human reviews deferred (D-071).
id: mietrecht
version: 0.2.0
core_api: ">=3.4,<4.0"
title: {de: Mietrecht, en: Tenancy law}
tier: experimental
scope:
  summary_de: "Eigene Wohnraummiete: qualifizierte Frist- und Rechenprüfungen, Entwürfe und Vorbereitung Ihrer Mieterberatung."
  own_matter_only: true
  out_of_scope:
    - Vermietervertretung und gewerbliche Vermietung
    - Automatische Minderungsquoten oder Mietspiegelwerte
    - Ungeprüfte Landesgebiete, gesetzliche Ausnahmen und Sonderverträge
    - Eigenständige Prozessführung oder Garantie einer Kündigungsheilung
corpus: corpus.yaml
intake: intake.yaml
intake_schema: intake-schema.yaml
dossier: dossier.yaml
fristen: fristen.yaml
parameters:
  domain: mietrecht
  files: [parameters/*.yaml]
calculators: calculators:CALCULATORS
prompts: prompts/profile.yaml
document_templates: documents/templates.yaml
documents: [pruefhinweise, mieterhoehung_antwort, betriebskosten_belegeinsicht, maengelanzeige, sozialwiderspruch]
goldset:
  path: goldset/goldset-v0.2.0.yaml
plain_language:
  files: {de: copy/de/plain.yaml, en: copy/en/plain.yaml, de-LS: copy/de-LS/plain.yaml}
  goldset: goldset/plain-v1.0.0.yaml
errata: errata.yaml
compliance:
  disclaimer_addendum: DISCLAIMER_ADDENDUM.md
  purpose_drift_deny_file: compliance/deny-phrases.json
legacy_aliases: []
