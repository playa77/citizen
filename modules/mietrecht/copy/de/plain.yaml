  miet_schonfrist:
    title: Schonfristzahlung prüfen
    action: Holen Sie unverzüglich Rat. Prüfen Sie vollständige Zahlung oder Verpflichtung einer öffentlichen
      Stelle und frühere Schonfristfälle. Eine ordentliche Kündigung bleibt gesondert prüfbedürftig.
