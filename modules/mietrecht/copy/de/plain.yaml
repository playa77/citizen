  miet_sozialwiderspruch:
    title: Widerspruch wegen besonderer Härte
    action: Lassen Sie Kündigung, Härtegründe, Hinweis und Textform unverzüglich prüfen. Bei fehlendem
      Hinweis können spätere Möglichkeiten bestehen.
    texts:
