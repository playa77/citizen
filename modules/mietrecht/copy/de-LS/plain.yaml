findings:
  miete_pruefen:
    title: Miete prüfen
    text: Die Miete muss geprüft werden. Eine Rechnung sagt nicht, ob die Erhöhung gilt.
    next_step: Nehmen Sie den Mietvertrag und das Schreiben zur Beratung mit.
  kosten_pruefen:
    title: Kosten prüfen
    text: Die Kosten müssen geprüft werden. Eine richtige Summe bedeutet keine sichere Zahlungspflicht.
    next_step: Fragen Sie nach den Belegen. Lassen Sie einzelne Kosten prüfen.
  frist_pruefen:
    title: Frist prüfen
    text: Wichtige Angaben fehlen noch. Das Datum auf dem Brief reicht nicht.
    next_step: Heben Sie den Umschlag auf. Lassen Sie Kündigungen und Gerichtsschreiben sofort prüfen.
  beratung_erforderlich:
    title: Hilfe suchen
    text: Ihr Fall braucht persönliche Beratung. Eine Zahlung beseitigt nicht immer jede Kündigung.
    next_step: Droht der Verlust Ihrer Wohnung? Holen Sie sofort Hilfe bei einer Beratung.
  einordnung_offen:
    title: Ergebnis noch offen
    text: Die Angaben reichen noch nicht. Daraus folgt keine sichere Entscheidung.
    next_step: Sammeln Sie die Unterlagen. Lassen Sie mögliche Fristen prüfen.
