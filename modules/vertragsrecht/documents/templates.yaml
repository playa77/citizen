        {absender}

        An [BITTE PRÜFEN: empfangsberechtigte Stelle und Anschrift]

        Betreff: [BITTE PRÜFEN: Vertrag, Buchung oder Forderung]

        [BITTE PRÜFEN: Buchung, ausführendes Luftfahrtunternehmen, Strecke, Flugdaten, tatsächliche
        Ankunft und Belege]

        [BITTE PRÜFEN: Anwendungsbereich, qualifizierte Anspruchsgrundlage, außergewöhnliche Umstände,
