        [BITTE PRÜFEN: Entfernung, Kürzungsgründe und Betrag; lange Verspätung erfordert einschlägige
        EuGH-Rechtsprechung]

        Ausgleich, Betreuung und Erstattung getrennt prüfen; keine automatische Anspruchsbestätigung.

        [BITTE PRÜFEN: Name, Form, Datum und nachweisbarer Zugang]

        Keine automatische Versendung oder gerichtliche Einreichung.

        '
