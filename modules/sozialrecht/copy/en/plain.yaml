findings:
  rechtswidrig:
    title: "Citizen found a possible error in the decision (Bescheid)"
    text: "The analysis suggests that the whole decision may be wrong. This is a preliminary assessment by Citizen, not a legal review."
    next_step: "Have the decision checked by a social-benefits advice centre or a lawyer for social law. Keep the deadline for an objection (Widerspruch) in mind."
  teilweise_rechtswidrig:
    title: "Citizen found a possible error in part of the decision (Bescheid)"
    text: "The analysis suggests that part of the decision may be wrong, for example a single amount. This is a preliminary assessment by Citizen, not a legal review."
    next_step: "Take the decision and the dossier to your advice appointment. There you can decide whether to object to this part. Keep the deadline in mind."
  ueberwiegend_rechtmaessig:
    title: "Citizen found no clear error"
    text: "The analysis found no error that clearly calls the decision into question. This does not mean the decision is certainly correct. Citizen can miss errors."
    next_step: "If you are unsure or something seems wrong to you, have the decision checked by an advice centre before the deadline ends."
  kein_verwaltungsakt:
    title: "This letter is probably not a decision (Bescheid)"
    text: "According to the analysis, the letter does not decide anything binding for you. It may be information, an invitation or a request for documents. Usually no objection is possible against such letters."
    next_step: "Read carefully whether the letter asks you to do something by a certain date, for example attend an appointment or send documents. If you are unsure, ask an advice centre."
  einordnung_offen:
    title: "Citizen cannot classify the letter yet"
    text: "The available legal texts and information are not enough for an assessment. This says nothing about whether the decision is right or wrong."
    next_step: "Have the letter checked by an advice centre. Bring the dossier and all documents. Keep possible deadlines in mind."

deadlines:
