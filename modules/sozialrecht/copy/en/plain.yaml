      provisional: "Your deadline for an objection probably ends on {frist_ende}. Please confirm the date of the letter so that Citizen can calculate the deadline reliably."
      provisional.jahr: "The decision probably lacks correct information about how to object. Your deadline would then end on {frist_ende}. Please confirm the date of the letter."
      missing_input: "Citizen cannot calculate the deadline yet because the date of the letter is missing. Please enter the date. Until then, act as soon as possible: the deadline is often only one month."
      not_applicable: "According to the analysis there is no objection deadline for this letter, because it is probably not a decision (Bescheid)."
