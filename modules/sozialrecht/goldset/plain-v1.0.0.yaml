# Sozialrecht — plain-language goldset (WP-122, D-068; gate: python -m eval.plain_eval).
#
# Each case runs the deterministic chain end to end: deadline cases feed facts
# into the Fristen core (app/dossier/deadlines.compute_deadlines) and render
# the result in every module language; finding cases classify an `ergebnis`
# opening sentence against the module's closed category vocabulary.
# `contains` / `excludes` pin what the person must (not) read — dates spelled
# out with the weekday, the statute basis, the duty-of-care next step.
# All inputs are synthetic.
# Semantic Version: 1.0.0 | 2026-11-17

format: citizen-plain-goldset-v1.0
module: sozialrecht
version: 1.0.0
cases:
  - id: PL-D01
    kind: deadline
    title: "Bescheid vom Montag 16.11.2026, Belehrung korrekt — Fristende fällt auf Sonntag, Rollover auf Montag"
    facts: { bescheid_datum: "2026-11-16", rbb_status: korrekt, ist_verwaltungsakt: true, bundesland: NW }
    spec_id: widerspruch_sgg_84
    expect:
      status: computed
      text_key: computed
      frist_ende: "2026-12-21"
      contains:
        de: ["Montag, 21. Dezember 2026", "§ 84 Abs. 1 SGG"]
        de-LS: ["Montag, 21. Dezember 2026"]
        en: ["Monday, 21 December 2026", "§ 84 Abs. 1 SGG"]
      banner: true

  - id: PL-D02
    kind: deadline
    title: "Rechtsbehelfsbelehrung fehlt — Jahresfrist nach § 66 Abs. 2 SGG"
    facts: { bescheid_datum: "2026-11-16", rbb_status: fehlt, ist_verwaltungsakt: true, bundesland: NW }
    spec_id: widerspruch_sgg_84
    expect:
      status: computed
      text_key: computed.jahr
      frist_ende: "2027-11-22"
      contains:
        de: ["Montag, 22. November 2027", "§ 66 Abs. 2 SGG"]
        de-LS: ["Montag, 22. November 2027", "mehr Zeit"]
        en: ["Monday, 22 November 2027", "§ 66 Abs. 2 SGG"]

  - id: PL-D03
    kind: deadline
    title: "Datum nur automatisch erkannt (vorgeschlagen) — vorläufige Frist"
    facts: { rbb_status: korrekt, ist_verwaltungsakt: true, bundesland: NW }
    proposed_letter_date: "2026-11-16"
    spec_id: widerspruch_sgg_84
    expect:
      status: provisional
      text_key: provisional
      frist_ende: "2026-12-21"
      contains:
        de: ["voraussichtlich", "Montag, 21. Dezember 2026", "bestätigen"]
        de-LS: ["wahrscheinlich", "Montag, 21. Dezember 2026"]
        en: ["probably", "Monday, 21 December 2026", "confirm"]
      banner: true

  - id: PL-D04
    kind: deadline
    title: "Kein Datum des Schreibens — keine Frist berechenbar, trotzdem Handlungsaufforderung"
    facts: {}
    spec_id: widerspruch_sgg_84
    expect:
      status: missing_input
      text_key: missing_input
      frist_ende: null
      contains:
        de: ["Datum", "so bald wie möglich"]
        de-LS: ["Datum", "schnell"]
        en: ["date", "as soon as possible"]
      excludes:
        de: ["{"]
        de-LS: ["{"]
        en: ["{"]
      banner: true

  - id: PL-D05
    kind: deadline
    title: "Kein Verwaltungsakt — keine Widerspruchsfrist, kein Banner"
    facts: { bescheid_datum: "2026-11-16", ist_verwaltungsakt: false }
    spec_id: widerspruch_sgg_84
    expect:
      status: not_applicable
      text_key: not_applicable
      frist_ende: null
      contains:
        de: ["keine Widerspruchsfrist"]
        de-LS: ["keine Frist"]
        en: ["no objection deadline"]
      banner: false

  - id: PL-D06
    kind: deadline
    title: "Bekanntgabefiktion fällt auf einen Sonntag (OQ-1) — die Copy nennt das frühere, konservative Fristende"
    facts: { bescheid_datum: "2025-12-10", rbb_status: korrekt, ist_verwaltungsakt: true, bundesland: BY }
    spec_id: widerspruch_sgg_84
    expect:
      status: computed
      text_key: computed
      frist_ende: "2026-01-14"
      contains:
        de: ["Mittwoch, 14. Januar 2026"]
        de-LS: ["Mittwoch, 14. Januar 2026"]
        en: ["Wednesday, 14 January 2026"]

  - id: PL-F01
    kind: finding
    title: "Vollständig rechtswidrig"
    ergebnis: "Vorläufige Einordnung: rechtswidrig. Der Bescheid berücksichtigt den Mehrbedarf nicht."
    expect: { category: rechtswidrig, category_source: ergebnis, contains: { de: ["Sozialberatungsstelle", "Frist"], en: ["advice centre", "deadline"] } }

  - id: PL-F02
    kind: finding
    title: "Teilweise rechtswidrig — längster Präfix gewinnt gegen 'rechtswidrig'"
    ergebnis: "Vorläufige Einordnung: teilweise rechtswidrig (Kosten der Unterkunft). Die Heizkosten …"
    expect: { category: teilweise_rechtswidrig, category_source: ergebnis }

  - id: PL-F03
    kind: finding
    title: "Überwiegend rechtmäßig — Copy entmutigt nicht und nennt die Beratung"
    ergebnis: "Vorläufige Einordnung: überwiegend rechtmäßig."
    expect:
      category: ueberwiegend_rechtmaessig
      category_source: ergebnis
      contains: { de: ["nicht, dass der Bescheid sicher richtig ist", "Sozialberatungsstelle"], en: ["certainly correct", "advice centre"] }

  - id: PL-F04
    kind: finding
    title: "Kein Verwaltungsakt"
    ergebnis: "Vorläufige Einordnung: kein Verwaltungsakt. Es handelt sich um eine Einladung."
    expect: { category: kein_verwaltungsakt, category_source: ergebnis }

  - id: PL-F05
    kind: finding
    title: "Einordnung offen (Core-Kategorie)"
    ergebnis: "Vorläufige Einordnung: Einordnung offen. Die Quellen reichen nicht aus."
    expect: { category: einordnung_offen, category_source: ergebnis }

  - id: PL-F06
    kind: finding
    title: "Begriff außerhalb des Vokabulars — Rückfall auf 'offen', nie auf beruhigende Copy"
    ergebnis: "Vorläufige Einordnung: wahrscheinlich in Ordnung."
    expect: { category: einordnung_offen, category_source: fallback }

  - id: PL-F07
    kind: finding
    title: "Kein Einordnungssatz — Rückfall auf 'offen'"
    ergebnis: "Der Bescheid ist korrekt berechnet."
    expect: { category: einordnung_offen, category_source: fallback }
