# Sozialrecht — the first Citizen module and DEFAULT_MODULE (D-036).
#
# WP-91 shipped the manifest, WP-92 the deadline specs (fristen.yaml); WP-93
# moved every Sozialrecht-specific piece of the v2.0.0 core into this
# directory (ARCHITECTURE.md § 8): corpus scope, intake tables and presets,
# stage prompt profile, versioned parameters, the SGB II calculator and
# rules engine, the 2026-07-01 regime provider, the action-draft templates
# and the goldsets. Behaviour is unchanged for requests that name no module.

# Semantic Version: 1.1.0 | 2026-11-16 — released with core 3.0.0 at the P9
# exit gate (WP-97): the version stays 1.1.0 (D-060's prompt-profile bump; 1.0.0
# was never published), the gate pins zero goldset regression against B0′.
# 1.1.0 — prompt set 3.0.0: prompt profile (issue_terms with norm anchors,
# result_categories), calculator prompts P-14/P-15, regime banners as
# constraints with a reference date (D-060).
# 1.0.0

id: sozialrecht
version: 1.1.0
core_api: ">=3.0,<4.0"
title:
  de: "Sozialrecht"
  en: "Social-benefits law"
tier: verified
scope:
  summary_de: "Bürgergeld/Grundsicherung (SGB II), Verfahren (SGB X), Sozialgerichtsverfahren (SGG)"
  own_matter_only: true
  out_of_scope:
    - "Rentenversicherung (SGB VI)"
    - "Krankenversicherung (SGB V)"
corpus: corpus.yaml
intake: intake.yaml
prompts: prompts/profile.yaml
# Parameter-store namespace = module id (WP-94: migration 013 rewrote the
# stored `sgb2` domain, ARCHITECTURE.md § 4).
parameters:
  domain: sozialrecht
  files: [parameters/*.yaml]
fristen: fristen.yaml
calculators: calculators:CALCULATORS
regimes:
  provider: regime:REGIME_PROVIDER
documents: [widerspruch, widerspruch_jahresfrist, ueberpruefungsantrag_44, akteneinsichtsantrag_25]
document_templates: documents/templates.yaml
goldset:
  path: goldset/goldset-v0.2.0.yaml
  # P9 exit gate (roadmap WP-97): zero regression against the WP-90 baseline
  # was replaced by the B0′ reference (D-061/D-062); this now names the
  # released state, so the next gate compares like-for-like (prompt set
  # 3.0.1, eval 1.1.0/1.2.0).
  gate:
    rule: zero_regression
    baseline_report: eval/results/20261116T175355Z-60c4afd.json
# WP-96: compliance declarations (ARCHITECTURE.md § 7). The deny phrases feed
# scripts/check_purpose_drift.py; the addendum is compiled into
# DISCLAIMER_DE.md / DISCLAIMER_EN.md Part D.
compliance:
  purpose_drift_deny_file: compliance/deny-phrases.json
  special_regimes:
    - "DSGVO Art. 9 (Gesundheits-/Behinderungsdaten)"
  disclaimer_addendum: DISCLAIMER_ADDENDUM.md
legacy_aliases: []
